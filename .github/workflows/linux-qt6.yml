name: Linux Qt6

on:
  push:
    paths:
      - 'linux/**'
      - 'tests/image_policy/**'
      - 'tests/image_file/**'
      - 'tests/config_text/**'
      - 'tests/format_policy/**'
      - 'tests/progress_policy/**'
      - 'tests/unattend/**'
      - 'tests/partition_layout/**'
      - 'tests/syslinux_version/**'
      - 'tests/syslinux_scan/**'
      - 'tests/grub_inspect/**'
      - 'tests/efi_boot_info/**'
      - 'tests/pe_arch/**'
      - 'res/syslinux/**'
      - 'res/uefi/**'
      - 'src/**'
      - 'res/icons/**'
      - 'res/rufus.ico'
      - '.github/workflows/linux-qt6.yml'
  pull_request:
    paths:
      - 'linux/**'
      - 'tests/image_policy/**'
      - 'tests/image_file/**'
      - 'tests/config_text/**'
      - 'tests/format_policy/**'
      - 'tests/progress_policy/**'
      - 'tests/unattend/**'
      - 'tests/partition_layout/**'
      - 'tests/syslinux_version/**'
      - 'tests/syslinux_scan/**'
      - 'tests/grub_inspect/**'
      - 'tests/efi_boot_info/**'
      - 'tests/pe_arch/**'
      - 'res/syslinux/**'
      - 'res/uefi/**'
      - 'src/**'
      - 'res/icons/**'
      - 'res/rufus.ico'
      - '.github/workflows/linux-qt6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-base-dev-tools dbus-daemon pkg-config libcdio-dev libiso9660-dev libudf-dev libwim-dev libfdisk-dev libblkid-dev libmount-dev libext2fs-dev libhivex-dev libssl-dev openssl fdisk libarchive-tools genisoimage dosfstools mtools ntfs-3g ntfs-3g-dev python3 curl patch desktop-file-utils zstd
      - name: Fetch upstream wimlib 1.14.5 release
        run: |
          curl -fL --retry 2 https://wimlib.net/downloads/wimlib-1.14.5.tar.gz -o "$RUNNER_TEMP/wimlib.tar.gz"
          echo "84221a3abd5b91228f15f8e6065c335a336237b5738197b75bf419eea561a194  $RUNNER_TEMP/wimlib.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/wimlib-source"
          tar -xf "$RUNNER_TEMP/wimlib.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/wimlib-source"
      - name: Configure
        run: cmake -S linux -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=/usr -DRUFUS_WIMLIB_UPSTREAM="$RUNNER_TEMP/wimlib-source" -DRUFUS_COMPARE_SYSTEM_WIMLIB=ON
      - name: Build
        run: cmake --build build/linux
      - name: Validate staged desktop integration
        run: |
          DESTDIR="$RUNNER_TEMP/rufus-package" cmake --install build/linux
          desktop-file-validate "$RUNNER_TEMP/rufus-package/usr/share/applications/org.rufus.Rufus.desktop"
          test -x "$RUNNER_TEMP/rufus-package/usr/bin/rufus-linux"
      - name: Test without hardware
        run: ctest --test-dir build/linux --output-on-failure --no-tests=error -L no-hardware
      - name: Build generated-image fixture probe
        run: |
          cmake -S linux/probes/libcdio -B build/image-fixture -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/image-fixture
      - name: Test classification through the bundled ISO reader
        run: ctest --test-dir build/image-fixture --output-on-failure --no-tests=error
